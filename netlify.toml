[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------- FUNCIONES ----------
# El asistente del sitio vive en netlify/functions/chat.mts y se publica en
# /api/chat (la ruta se declara con `export const config` dentro de la propia
# función).
#
# Variables de entorno a configurar en el panel de Netlify — NUNCA en el repo:
#   GROQ_API_KEY       clave de Groq. Es la que usa el sitio.
#   ANTHROPIC_API_KEY  opcional, repuesto si Groq falla.
#   GROQ_MODEL         opcional, para forzar un modelo concreto. Por defecto se
#                      usa la lista MODELOS_GROQ de chat.mts, que lleva relevo:
#                      si Groq retira el primero, se prueba el siguiente.
#   CHAT_MAX_PER_DAY   opcional, techo diario de mensajes (300 por defecto).
#
# Sin ninguna clave el endpoint sigue respondiendo: deriva al correo y al
# P.B.X. en vez de fallar. Las claves solo existen en el servidor; el navegador
# nunca las ve.
#
# La API de Conversiones de Meta vive en netlify/functions/capi.mts y se
# publica en /api/capi. Sus variables, también en el panel de Netlify:
#   META_CAPI_ACCESS_TOKEN  token generado en Events Manager. ES UN SECRETO:
#                           da permiso para escribir en el conjunto de datos de
#                           la empresa. Sin él, el endpoint responde bien y no
#                           manda nada; el píxel del navegador sigue midiendo.
#   META_PIXEL_ID           opcional. Por defecto, el píxel del sitio.
#   META_API_VERSION        opcional. Por defecto v21.0. Se sube desde aquí
#                           cuando Meta retire esa versión, sin tocar código.
#   META_TEST_EVENT_CODE    SOLO para probar, y SOLO en una preview. Mientras
#                           esté puesta, los eventos van a la pestaña «Eventos
#                           de prueba» EN LUGAR de a los informes: dejarla en
#                           producción es quedarse sin medición real.
#
# Los formularios de contacto y suscripción viven en
# netlify/functions/contacto.mts (/api/contacto) y suscripcion.mts
# (/api/suscripcion), y los dos entregan por Resend. A diferencia de CAPI, no
# tienen un camino de repuesto si faltan estas variables: el formulario
# responde con error y el sitio ofrece WhatsApp como alternativa.
#   RESEND_API_KEY       clave de Resend, con permiso de envío únicamente. ES
#                         UN SECRETO. La cuenta de Resend es la de la empresa,
#                         no la de quien despliegue el sitio.
#   RESEND_FROM           opcional. Remitente de los correos, con el formato
#                         «Nombre <correo@dominio>». Por defecto
#                         «B&S Logistics <contacto@byslogistics.com.co>». El
#                         dominio tiene que estar verificado en Resend.
#   RESEND_CONTACT_TO     opcional, separado por comas si es más de un
#                         correo. A quién llega el aviso del formulario de
#                         contacto. Por defecto, a ventas@precintosdeseguridad.co
#                         y a los otros dos correos administrativos del dominio
#                         (ver AVISO_ADICIONAL en contacto.mts).
#
# suscripcion.mts solo necesita RESEND_API_KEY: crear un contacto en Resend no
# pide el identificador de ninguna audiencia (la cuenta tiene una sola).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cabeceras de seguridad. Equivalen a las que traía vercel.json.
#
# La CSP es una lista blanca: lo que no esté aquí, el navegador no lo carga. Por
# eso cada permiso de terceros dice a qué corresponde, y por eso añadir una
# herramienta al sitio pasa SIEMPRE por tocar esta línea. Hoy hay tres:
#
#   - Google Maps (frame-src) — el mapa incrustado de la página de contacto.
#   - Píxel de Meta — el script sale de connect.facebook.net, manda los eventos
#     a www.facebook.com y, sin JavaScript, pide la imagen de un píxel al mismo
#     dominio (de ahí que esté en script-src, connect-src e img-src).
#   - Etiqueta de Google / GA4 — el script sale de www.googletagmanager.com y
#     los golpes van a *.google-analytics.com y *.analytics.google.com. Los
#     comodines son necesarios: GA4 usa subdominios por región
#     (region1.google-analytics.com y compañía).
#
# Los formularios siguen enviando al propio sitio ('self'), que es como funciona
# Netlify Forms.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-src 'self' https://www.google.com; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "interest-cohort=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Los recursos con hash en el nombre no cambian nunca: se cachean para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
