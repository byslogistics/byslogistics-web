name: CI

on:
  # Sin filtro de ramas: la rama por defecto de este repositorio no se llama
  # main ni master, así que filtrar por esos nombres dejaba los push sin
  # verificar. Solo corría en los pull request.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma del campo packageManager de package.json, para
      # que CI use exactamente la misma que en desarrollo. Fijarla aquí a mano
      # fue la causa del fallo anterior: con pnpm 9, `pnpm store path` aborta
      # si pnpm-workspace.yaml no declara `packages`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Tipos y build
        run: pnpm build

      - name: Contenido y catálogo
        run: pnpm test:content

      - name: HTML generado
        run: pnpm test:build

      # El asistente. No sale a la red: el proveedor se sustituye por un doble
      # dentro del propio test, así que no necesita ninguna clave.
      - name: Asistente
        run: pnpm test:chat

      # La API de Conversiones de Meta. Tampoco sale a la red: el `fetch` se
      # sustituye por un doble que captura lo que se le habría mandado a Meta,
      # así que no necesita el token de CAPI.
      - name: Conversiones de Meta
        run: pnpm test:capi

      # Formulario de contacto y suscripción a novedades. Tampoco salen a la
      # red: el `fetch` hacia Resend se sustituye por un doble, así que no
      # necesitan RESEND_API_KEY.
      - name: Formulario de contacto
        run: pnpm test:contacto

      - name: Suscripción a novedades
        run: pnpm test:suscripcion

      - name: Rutas servidas
        run: pnpm test:smoke

      - name: Instalar Chromium para los tests de navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Comportamiento y accesibilidad
        run: pnpm test:e2e
